<!-- header.html -->
<header class="site-header">
  <div class="topbar">
    <nav class="header-nav" aria-label="Top navigation">
      <a href="/math/">Math</a>
      <span aria-hidden="true">|</span>
      <a href="/math8/m8_index.html">Math 8 Home</a>
    </nav>
  </div>

  <div class="page-header">
    <h1 id="page-title" class="page-title">Math 8</h1>
    <div id="unit-title" class="unit-title" style="display:none;"></div>
  </div>
</header>

<script>
  // Always override to avoid conflicts with main.js
  window.initNavSystems = function () {
    const pageTitleEl = document.getElementById("page-title");
    const unitTitleEl = document.getElementById("unit-title");
    if (!pageTitleEl) return;

    const nav = window.NAV_DATA && window.NAV_DATA.math8;
    if (!nav) return;

    const normalize = (p) => {
      if (!p) return "";
      p = p.split("?")[0].split("#")[0];

      // Normalize any "*_index", "*_index.html" to the folder
      p = p.replace(/\/[^\/]+_index(?:\.html)?$/i, "/");

      // Ensure trailing slash
      if (!p.endsWith("/")) p += "/";
      return p;
    };

    const current = normalize(window.location.pathname);

    // Default values
    let pageLabel = document.title || "Math 8";
    let unitLabel = "";

    // 1) Exact HOME match only (no startsWith)
    if (nav.home && normalize(nav.home.href) === current) {
      pageLabel = nav.home.label || "Math 8 Home";
      unitLabel = "";
    } else {
      // 2) Find exact lesson match by normalized path
      const units = nav.units || {};
      outer:
      for (const unit of Object.values(units)) {
        const lessons = Array.isArray(unit.lessons) ? unit.lessons : [];
        for (const lesson of lessons) {
          if (normalize(lesson.href) === current) {
            pageLabel = lesson.label || pageLabel;
            unitLabel = unit.label || "";
            break outer;
          }
        }
      }
    }

    // Apply to header
    pageTitleEl.textContent = pageLabel;

    if (unitLabel) {
      unitTitleEl.textContent = unitLabel;
      unitTitleEl.style.display = "";
    } else {
      unitTitleEl.textContent = "";
      unitTitleEl.style.display = "none";
    }
  };
</script>
